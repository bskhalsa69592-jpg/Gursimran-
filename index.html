let currentTopic=0;
function enterSite(){document.getElementById('welcome').style.display='none';document.getElementById('app').style.display='block';renderTopics();renderQuestions();}
function renderTopics(){
 const box=document.getElementById('topicList'); box.innerHTML='';
 topics.forEach((t,i)=>{const b=document.createElement('button');b.className='topic'+(i===currentTopic?' active':'');b.textContent=t.name;b.onclick=()=>{currentTopic=i;document.getElementById('search').value='';renderTopics();renderQuestions();};box.appendChild(b);});
}
function renderQuestions(){
 const t=topics[currentTopic]; document.getElementById('topicTitle').textContent=t.name;
 document.getElementById('topicInfo').textContent=t.questions.length+' solved practice questions';
 const term=document.getElementById('search').value.toLowerCase(); const box=document.getElementById('questionList');box.innerHTML='';
 t.questions.forEach((q,i)=>{
   if(!q[0].toLowerCase().includes(term)) return;
   const card=document.createElement('article');card.className='question';
   const h=document.createElement('h3');h.textContent=(i+1)+'. '+q[0];card.appendChild(h);
   const btn=document.createElement('button');btn.className='small';btn.textContent='Show Answer';
   const ans=document.createElement('div');ans.className='answer';
   const p=document.createElement('p');p.textContent=q[1];ans.appendChild(p);
   const pre=document.createElement('pre');pre.textContent=q[2];ans.appendChild(pre);
   const copy=document.createElement('button');copy.className='small';copy.textContent='Copy Code';copy.onclick=()=>{navigator.clipboard.writeText(q[2]).then(()=>copy.textContent='Copied');};
   ans.appendChild(copy);btn.onclick=()=>{ans.style.display=ans.style.display==='block'?'none':'block';btn.textContent=ans.style.display==='block'?'Hide Answer':'Show Answer';};
   card.appendChild(btn);card.appendChild(ans);box.appendChild(card);
 });
 if(!box.children.length) box.textContent='No matching question found.';
}
</script>
